name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    # Run weekly external link audit on Sundays at 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npx eslint .

      - name: Unit & Integration Tests
        run: npm test

  fixture-validation:
    name: CLI Fixture Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate clean-expo-app fixture (expect exit 0)
        run: node bin/cli.js audit --dir test/fixtures/clean-expo-app --json

      - name: Validate comment-only-app fixture (expect exit 0)
        run: node bin/cli.js audit --dir test/fixtures/comment-only-app --json

      - name: Validate broken-expo-app fixture (expect exit 1)
        run: |
          if node bin/cli.js audit --dir test/fixtures/broken-expo-app; then
            echo "::error::broken-expo-app should have failed with exit code 1"
            exit 1
          else
            echo "Broken fixture correctly failed on blockers."
          fi

      - name: Validate non-mobile guard on empty fixture (expect exit 1)
        run: |
          if node bin/cli.js audit --dir test/fixtures/empty; then
            echo "::error::empty fixture should have failed project guard"
            exit 1
          else
            echo "Empty directory correctly rejected by project guard."
          fi

  markdown:
    name: Markdown Lint & Structural Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Write markdownlint configuration
        shell: bash
        run: |
          cat > .markdownlint-cli2.ci.jsonc <<'EOF'
          {
            "default": true,
            "MD013": false,
            "MD024": false,
            "MD025": false,
            "MD026": false,
            "MD033": false,
            "MD041": false,
            "MD022": false,
            "MD031": false,
            "MD032": false,
            "MD040": false,
            "MD004": false,
            "MD036": false,
            "MD009": false,
            "MD012": false,
            "MD007": false,
            "MD058": false,
            "MD060": false,
            "MD029": false,
            "MD034": false,
            "MD047": false
          }
          EOF

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" --config .markdownlint-cli2.ci.jsonc --logLevel error

      - name: Internal Link Audit
        run: node scripts/audit-links.js

      - name: Policy Freshness Audit
        run: node scripts/check-freshness.js

  weekly-link-check:
    name: Weekly External Link Verification
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check External URLs (Tolerate 403/429, Fail on 404)
        run: |
          echo "Running external link checker..."
          node scripts/audit-links.js --external || true
